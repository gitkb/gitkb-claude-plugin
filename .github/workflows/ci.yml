name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run lint
        run: make lint

  test:
    # Fork PRs skip this job: it uses the repo token to clone gitkb sources
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install git-kb from source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          INSTALL_DIR="${RUNNER_TEMP}/gitkb-bin"
          SRC="${RUNNER_TEMP}/gitkb-src"
          mkdir -p "$INSTALL_DIR" "$SRC/vendor"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: bearer ${GH_TOKEN}" \
            clone --depth 1 https://github.com/gitkb/gitkb-core.git "$SRC/gitkb-core"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: bearer ${GH_TOKEN}" \
            clone --depth 1 https://github.com/gitkb/tree-sitter-markdown.git "$SRC/vendor/tree-sitter-markdown"
          cargo install --path "$SRC/gitkb-core/crates/gitkb-cli" --root "$INSTALL_DIR"
          rm -rf "$SRC"
          echo "$INSTALL_DIR/bin" >> "$GITHUB_PATH"

      - name: Install test deps
        run: sudo apt-get update && sudo apt-get install -y bats parallel

      - name: Verify git-kb
        run: git-kb --version

      - name: Configure git
        run: |
          git config --global user.email "ci@gitkb.com"
          git config --global user.name "CI"

      - name: Run tests
        run: make test
