name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]

jobs:
  lint:
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run lint
        run: make lint

  test:
    # Fork PRs skip this job
    if: github.event_name == 'push' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.draft != true)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install released git-kb
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          INSTALL_DIR="${RUNNER_TEMP}/gitkb-bin"
          mkdir -p "$INSTALL_DIR"
          cd "$RUNNER_TEMP"
          gh release download -R gitkb/gitkb-releases -p 'gitkb-linux-x64.tar.gz*'
          sha256sum -c gitkb-linux-x64.tar.gz.sha256
          tar -xzf gitkb-linux-x64.tar.gz -C "$INSTALL_DIR"
          echo "$INSTALL_DIR" >> "$GITHUB_PATH"

      - name: Install test deps
        run: sudo apt-get update && sudo apt-get install -y bats parallel

      - name: Verify git-kb
        run: git-kb --version

      - name: Configure git
        run: |
          git config --global user.email "ci@gitkb.com"
          git config --global user.name "CI"

      - name: Run tests
        run: make test
